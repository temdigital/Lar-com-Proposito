name: Validate static build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: npm run build

      - name: Verify required outputs
        run: |
          test -f dist/index.html
          test -f dist/sobre.html
          test -f dist/fale-conosco.html
          test -f dist/privacidade.html
          test -f dist/app/index.html
          test -f dist/admin/index.html
          test -f dist/src/js/member.js
          test -f dist/src/js/admin.js
          test -f dist/src/styles/app.css
          test -f dist/src/styles/admin.css
          test -f dist/.well-known/security.txt
          test -f dist/sitemap.xml
          test -f dist/src/styles/public-navigation.css
          ! test -f dist/seguranca.html
