name: Validate static build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check src/js/admin.js
          node --check src/js/admin-courses.js
          node --check src/js/admin-curriculum.js
          node --check src/js/admin-people.js
          node --check src/js/admin-community.js
          node --check src/js/admin-content.js
          node --check src/js/admin-content-page.js
          node --check src/js/invite-page.js
          node --check src/js/auth-page.js
          node --check src/js/member.js
          node --check src/js/member-community.js
          node --check src/js/member-community-page.js
          node --check src/js/member-content-page.js

      - name: Build static site
        run: npm run build

      - name: Verify required outputs
        run: |
          test -f dist/index.html
          test -f dist/sobre.html
          test -f dist/fale-conosco.html
          test -f dist/privacidade.html
          test -f dist/aceite-convite.html
          test -f dist/app/index.html
          test -f dist/admin/index.html
          test -f dist/src/js/member.js
          test -f dist/src/js/member-community.js
          test -f dist/src/js/member-community-page.js
          test -f dist/src/js/member-content-page.js
          test -f dist/src/js/admin.js
          test -f dist/src/js/admin-courses.js
          test -f dist/src/js/admin-curriculum.js
          test -f dist/src/js/admin-people.js
          test -f dist/src/js/admin-community.js
          test -f dist/src/js/admin-content.js
          test -f dist/src/js/admin-content-page.js
          test -f dist/src/js/invite-page.js
          test -f dist/src/styles/app.css
          test -f dist/src/styles/member-community.css
          test -f dist/src/styles/member-content.css
          test -f dist/src/styles/admin.css
          test -f dist/src/styles/admin-courses.css
          test -f dist/src/styles/admin-course-metrics.css
          test -f dist/src/styles/admin-people.css
          test -f dist/src/styles/admin-community.css
          test -f dist/src/styles/admin-content.css
          test -f dist/src/styles/invite.css
          test -f dist/.well-known/security.txt
          test -f dist/sitemap.xml
          test -f dist/src/styles/public-navigation.css
          ! test -f dist/seguranca.html
